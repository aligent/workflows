name: Export environment variables
description: |
  Appends KEY=value lines (and KEY<<DELIM multiline blocks) to $GITHUB_ENV so later
  steps in the job can use them. With mask set to 'true', every value is masked before
  it is exported.
  
  Warning: only pass trusted input, such as repository variables and secrets. The input
  can set any environment variable for later steps, including ones that run code
  (BASH_ENV, LD_PRELOAD, NODE_OPTIONS), so never include data an attacker can influence,
  such as pull request titles or branch names.

inputs:
  value:
    description: Newline-separated KEY=value pairs, or KEY<<DELIM blocks for multiline values
    required: false
    default: ''
  mask:
    description: "'true' to mask every value before it is exported, 'false' if the input contains no secrets"
    required: true

runs:
  using: composite
  steps:
    - name: Export environment variables
      shell: bash
      env:
        INPUT_VALUE: ${{ inputs.value }}
        INPUT_MASK: ${{ inputs.mask }}
      run: | # zizmor: ignore[github-env] see the comment above the $GITHUB_ENV write
        # The runner doesn't enforce required inputs, and a missing mask would otherwise
        # mean no masking, so fail unless it is set explicitly.
        case "$INPUT_MASK" in
          true | false) ;;
          *)
            echo "::error title=export-env-vars::The mask input must be 'true' or 'false', got '$INPUT_MASK'"
            exit 1
            ;;
        esac

        # CRs are stripped from the input (tr -d '\r'): on Linux the runner only splits on LF,
        # so CRLF input would leave a trailing CR on values and break KEY<<EOF delimiter matching.
        if [[ "$INPUT_VALUE" == *$'\r'* ]]; then
          echo "::warning title=export-env-vars::Input contains carriage returns (\\r), probably from Windows (CRLF)" \
            "line endings. They have been removed; re-save the variable or secret with LF line endings" \
            "to silence this warning."
        fi

        # Mask values here, before they reach $GITHUB_ENV, so they are already masked
        # when later steps list the environment in their log headers.
        # The runner still does the parsing; this only works out which text is a value,
        # using the same rule as the runner: a line is KEY<<DELIM only if << comes before any =.
        if [ "$INPUT_MASK" = "true" ]; then
          awk '
            # Emit an add-mask command, skipping blank or whitespace-only values.
            # % is escaped because the runner decodes %25, %0D and %0A in add-mask values.
            function mask(s) {
              if (s ~ /[^[:space:]]/) {
                gsub(/%/, "%25", s)
                print "::add-mask::" s
              }
            }

            # Remove CRs, as they are removed from what is written to $GITHUB_ENV.
            { gsub(/\r/, "") }

            # Inside a KEY<<DELIM block: mask each line whole (even if it contains =)
            # until the closing delimiter, which is not masked.
            delim != "" {
              if ($0 == delim) delim = ""
              else mask($0)
              next
            }

            # KEY<<DELIM header: remember the delimiter; the header itself holds no value.
            # [^=<]* stops at the first << and fails if an = comes before it.
            match($0, /^[^=<]*<</) {
              delim = substr($0, RLENGTH + 1)
              next
            }

            # KEY=value: mask everything after the first =.
            index($0, "=") {
              mask(substr($0, index($0, "=") + 1))
            }
          ' <<< "$INPUT_VALUE"
        fi

        # Writing to $GITHUB_ENV lets the input set any variable for later steps, including
        # ones that run code (BASH_ENV, LD_PRELOAD, NODE_OPTIONS), which is why zizmor flags
        # it. Exporting caller-supplied variables is this action's purpose, so callers must
        # only pass trusted input (repository variables and secrets), never data an attacker
        # can influence, such as pull request titles or branch names.
        tr -d '\r' <<< "$INPUT_VALUE" >> "$GITHUB_ENV"
