name: Vercel Preview Deployment

on:
  workflow_call:
    inputs:
      vercel-org-id:
        description: "Vercel organisation ID"
        type: string
        required: true
      vercel-project-id:
        description: "Vercel project ID"
        type: string
        required: true
      working-directory:
        description: "Directory to run the Vercel deploy from"
        type: string
        required: false
        default: "."
      environment-name:
        description: "GitHub Environment to deploy to"
        type: string
        required: false
        default: "Preview"
      performance-check:
        description: >-
          Run a Lighthouse performance check against the preview and comment
          the median Core Web Vitals on the pull request. Requires
          measured-paths to be set.
        type: boolean
        required: false
        default: false
      measured-paths:
        description: >-
          Paths to measure, one per line, relative to the preview URL
          (e.g. "/"). Newline-delimited so paths may contain query strings.
          The performance check is skipped when this is empty.
        type: string
        required: false
        default: ""
      lighthouse-config-path:
        description: >-
          Path to a Lighthouse CI config file in the calling repository,
          holding run count and budgets.
        type: string
        required: false
        default: ".github/lighthouse/lighthouserc.json"
      node-version-file:
        description: "File to read the Node version from for the performance check"
        type: string
        required: false
        default: ".nvmrc"
    secrets:
      vercel-token:
        description: "Vercel deployment token"
        required: true
      vercel-automation-bypass-secret:
        description: >-
          Vercel Protection Bypass for Automation secret. Required for the
          performance check when Deployment Protection is enabled.
        required: false

concurrency:
  group: vercel-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Deploy Preview to Vercel
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    environment:
      name: ${{ inputs.environment-name }}
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ inputs.vercel-org-id }}
      VERCEL_PROJECT_ID: ${{ inputs.vercel-project-id }}
      VERCEL_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
        with:
          persist-credentials: false

      - name: Install safe-chain
        run: |
          SAFE_CHAIN_URL="https://github.com/AikidoSec/safe-chain/releases/latest/download/install-safe-chain.sh"
          curl -fsSL "$SAFE_CHAIN_URL" | sh -s -- --ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel (preview)
        id: deploy
        working-directory: ${{ inputs.working-directory }}
        env:
          VERCEL_TOKEN: ${{ secrets.vercel-token }}
        run: |
          vercel deploy --yes --no-wait --token="$VERCEL_TOKEN" \
            > deployment-url.txt 2> >(tee vercel-output.log >&2)
          url="$(cat deployment-url.txt)"
          inspect_url="$(grep -m1 -o 'https://vercel.com/[^[:space:]]*' vercel-output.log || true)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "inspect_url=$inspect_url" >> "$GITHUB_OUTPUT"

      # Posts (or updates in place) a single comment on the PR with the preview URL.
      - name: Comment preview URL on PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          INSPECT_URL: ${{ steps.deploy.outputs.inspect_url }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- vercel-preview -->'
          body="$marker
          ### ⚡ Preview environment is deploying

          Wait ~5 minutes for completion, or monitor progress using the Inspect URL.

          **Preview URL:** ${DEPLOY_URL}
          **Inspect:** ${INSPECT_URL}

          _Deployed commit ${COMMIT_SHA}_"

          comment_id="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq "[.[] | select(.body | startswith(\"${marker}\"))][0].id")"

          if [ -n "$comment_id" ] && [ "$comment_id" != "null" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${comment_id}" -f body="$body"
          else
            gh api -X POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="$body"
          fi

  # Opt-in: measures Core Web Vitals against the preview deployment and
  # comments the median results on the pull request. Skipped entirely unless
  # the caller sets performance-check and provides measured-paths.
  performance:
    name: Preview Performance
    needs: deploy-preview
    if: inputs.performance-check && inputs.measured-paths != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      # How long to wait for the preview deployment to finish building.
      READY_TIMEOUT: 10m
      MEASURED_PATHS: ${{ inputs.measured-paths }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
        with:
          persist-credentials: false

      # `package-manager-cache: false` because this job never installs project
      # dependencies — it only needs Node to summarise the Lighthouse results.
      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 #v6.0.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          package-manager-cache: true

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # The deploy job uses `--no-wait`, so the deployment is still building
      # when this job starts. Wait for it to finish so the performance check can run against a fully built preview.
      - name: Wait for preview deployment
        id: deployment
        env:
          VERCEL_TOKEN: ${{ secrets.vercel-token }}
          VERCEL_ORG_ID: ${{ inputs.vercel-org-id }}
          DEPLOY_URL: ${{ needs.deploy-preview.outputs.url }}
        run: |
          set -euo pipefail

          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::The deploy job did not produce a preview URL."
            exit 1
          fi

          echo "Waiting for ${DEPLOY_URL} to become ready."
          if ! vercel inspect "$DEPLOY_URL" \
            --token="$VERCEL_TOKEN" \
            --scope="$VERCEL_ORG_ID" \
            --wait \
            --timeout "$READY_TIMEOUT"; then
            echo "::error::Preview deployment was not ready within ${READY_TIMEOUT}."
            exit 1
          fi

          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

      # The first request to a cold preview pays serverless cold start and any
      # on-demand page generation. Measuring that would report build latency
      # rather than page performance, so discard it. Each path is warmed
      # separately because they are generated on demand independently.
      - name: Warm up preview deployment
        id: urls
        env:
          BASE_URL: ${{ steps.deployment.outputs.url }}
          BYPASS_SECRET: ${{ secrets.vercel-automation-bypass-secret }}
        run: |
          set -euo pipefail

          failed=0
          urls=""

          # Read line by line: a path may contain `?` and `&`, so splitting on
          # whitespace would mangle it.
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            url="${BASE_URL}${path}"
            urls="${urls}${url}"$'\n'

            for attempt in 1 2 3; do
              status="$(curl -sS -o /dev/null -w '%{http_code}' -L \
                --max-time 60 \
                ${BYPASS_SECRET:+-H "x-vercel-protection-bypass: ${BYPASS_SECRET}"} \
                "$url" || echo 000)"
              echo "Warm-up ${url} attempt ${attempt}: HTTP ${status}"
              [ "$status" = "200" ] && break
              [ "$attempt" = "3" ] && failed=1
              sleep 5
            done
          done <<< "$MEASURED_PATHS"

          if [ "$failed" = "1" ]; then
            echo "::error::One or more URLs did not return HTTP 200 after 3 warm-up requests."
            echo "::error::If Deployment Protection is enabled, pass the vercel-automation-bypass-secret secret."
            exit 1
          fi

          # Hand the fully-qualified URLs to the Lighthouse step so the list is
          # defined once, by the caller, in measured-paths.
          {
            echo "list<<URLS_EOF"
            printf '%s' "$urls"
            echo "URLS_EOF"
          } >> "$GITHUB_OUTPUT"

      # Run count and budgets come from the caller's Lighthouse CI config. Set
      # `aggregationMethod: median` there: LHCI defaults to `optimistic`, which
      # takes the best run and hides the variance that multiple runs exist to
      # smooth out.
      - name: Run Lighthouse
        id: lighthouse
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 #v12.6.1
        with:
          urls: ${{ steps.urls.outputs.list }}
          configPath: ${{ inputs.lighthouse-config-path }}
          uploadArtifacts: true
          artifactName: lighthouse-reports

      - name: Summarise results
        id: summary
        env:
          RESULTS_PATH: ${{ steps.lighthouse.outputs.resultsPath }}
          ASSERTION_RESULTS: ${{ steps.lighthouse.outputs.assertionResults }}
        run: |
          set -euo pipefail

          cat > summarise.mjs <<'SUMMARISE_EOF'
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';

          const METRICS = [
              ['largest-contentful-paint', 'LCP', 'ms'],
              ['total-blocking-time', 'TBT', 'ms'],
              ['cumulative-layout-shift', 'CLS', ''],
              ['first-contentful-paint', 'FCP', 'ms'],
              ['speed-index', 'SI', 'ms'],
          ];

          const format = (value, unit) => {
              if (typeof value !== 'number') return 'n/a';
              if (unit !== 'ms') return value.toFixed(3);
              return value >= 1000
                  ? `${(value / 1000).toFixed(2)} s`
                  : `${Math.round(value)} ms`;
          };

          const toLabel = (url) => {
              try {
                  return new URL(url).pathname || '/';
              } catch {
                  return url;
              }
          };

          const manifest = JSON.parse(
              readFileSync(join(process.env.RESULTS_PATH, 'manifest.json'), 'utf8')
          );

          // LHCI writes one manifest entry per run. The entry flagged as the
          // representative run is the median run for that URL, so reporting it
          // keeps this summary consistent with what the assertions checked.
          const representative = manifest.filter((entry) => entry.isRepresentativeRun);
          if (representative.length === 0) {
              console.error('Manifest contained no representative run.');
              process.exit(1);
          }

          // Assertion failures are keyed by URL so each row can be flagged.
          const warningsByUrl = new Map();
          try {
              for (const result of JSON.parse(process.env.ASSERTION_RESULTS || '[]')) {
                  if (!result.url) continue;
                  const existing = warningsByUrl.get(result.url) ?? new Set();
                  existing.add(result.auditId);
                  warningsByUrl.set(result.url, existing);
              }
          } catch (error) {
              console.error(`Could not parse assertion results: ${error.message}`);
          }

          const lines = [];
          let anyWarnings = false;

          for (const entry of representative) {
              const report = JSON.parse(readFileSync(entry.jsonPath, 'utf8'));
              const warned = warningsByUrl.get(entry.url) ?? new Set();
              if (warned.size > 0) anyWarnings = true;

              const score = entry.summary?.performance;
              lines.push(
                  `#### \`${toLabel(entry.url)}\``,
                  '',
                  `**Performance score:** ${
                      typeof score === 'number' ? Math.round(score * 100) : 'n/a'
                  }/100${warned.has('categories:performance') ? ' ⚠️' : ''}`,
                  '',
                  '| Metric | Median | |',
                  '| --- | --- | --- |'
              );

              for (const [id, label, unit] of METRICS) {
                  const value = report.audits?.[id]?.numericValue;
                  lines.push(
                      `| ${label} | ${format(value, unit)} | ${
                          warned.has(id) ? '⚠️' : '✅'
                      } |`
                  );
              }

              lines.push('');
          }

          const runs = manifest.length / representative.length;
          lines.push(`_Median of ${runs} run${runs === 1 ? '' : 's'} per URL._`);

          // Preview deployments are cold and CPU-shared on CI runners, so treat
          // these as a smoke signal for large regressions, not a benchmark.
          if (anyWarnings) {
              lines.push(
                  '',
                  '⚠️ One or more metrics are over budget. Preview deployments ' +
                      'are slower than production — confirm against a second run ' +
                      'before treating this as a real regression.'
              );
          }

          console.log(lines.join('\n'));
          SUMMARISE_EOF

          node summarise.mjs > lighthouse-summary.md
          cat lighthouse-summary.md

      # Posts (or updates in place) a single comment on the PR, separate from
      # the preview URL comment above.
      - name: Comment performance results on PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          marker='<!-- vercel-preview-performance -->'
          {
            echo "$marker"
            echo "### 📊 Preview performance"
            echo
            cat lighthouse-summary.md
            echo
            echo "[Full reports](${RUN_URL}) · _commit ${COMMIT_SHA}_"
          } > comment.md

          comment_id="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq "[.[] | select(.body | startswith(\"${marker}\"))][0].id")"

          if [ -n "$comment_id" ] && [ "$comment_id" != "null" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${comment_id}" -F body=@comment.md
          else
            gh api -X POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -F body=@comment.md
          fi
