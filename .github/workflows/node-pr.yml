name: 🕵️ Node Pull Request Checks

on:
  workflow_call:
    secrets:
      NPM_TOKEN:
        description: "NPM authentication token for private registries"
        required: false
      ENV_VARS:
        description: "Additional environment variables as key=value pairs (supports multiline values like SSH keys)"
        required: false
    inputs:
      package-manager:
        description: "Node package manager to use"
        default: yarn
        type: string
      is-yarn-classic:
        description: "If Yarn (pre-Berry) should be used"
        default: false
        type: boolean
      build-command:
        description: "Command to override the build command"
        default: build
        type: string
      test-command:
        description: "Command to override the test command"
        default: test
        type: string
      lint-command:
        description: "Command to override the lint command"
        default: lint
        type: string
      format-command:
        description: "Command to override the format command"
        default: format
        type: string
      test-storybook-command:
        description: "Command to override the test-storybook command"
        default: test-storybook
        type: string
      check-types-command:
        description: "Command to override the check-types command"
        default: check-types
        type: string
      skip-build:
        description: "If the build step should skipped"
        default: false
        type: boolean
      skip-test:
        description: "If the test step should skipped"
        default: false
        type: boolean
      skip-lint:
        description: "If the lint step should skipped"
        default: false
        type: boolean
      skip-format:
        description: "If the format step should skipped"
        default: false
        type: boolean
      skip-test-storybook:
        description: "If the test-storybook step should skipped"
        default: false
        type: boolean
      skip-check-types:
        description: "If the check-types step should skipped"
        default: false
        type: boolean
      skip-cache:
        description: "If the cache should be skipped when installing dependencies"
        default: false
        type: boolean
      pre-install-commands:
        description: "Commands to run before dependency installation (e.g., configure registries, auth tokens)"
        default: ""
        type: string
      debug:
        description: "If debug flags should be set"
        default: false
        type: boolean
      pre-test-command:
        description: >-
          A script to run before the test checks (e.g., generate:types for code generation).
          Runs as: <package-manager> run <command>
        default: ""
        type: string
      node-options:
        description: "Value for NODE_OPTIONS environment variable (e.g., --max-old-space-size=4096)"
        default: ""
        type: string
      has-env-vars:
        description: "Deprecated: ignored"
        default: false
        type: boolean
      fetch-depth:
        description: "Deprecated: ignored"
        default: 1
        type: number

jobs:
  build:
    name: 🏗️ Build
    if: inputs.skip-build == false
    runs-on: ubuntu-latest
    env:
      HAVE_SECRETS_ENV_VARS: ${{ secrets.ENV_VARS != '' }}
      NODE_OPTIONS: ${{ inputs.node-options }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
        with:
          persist-credentials: false

      - name: Fetch all commit history for Nx
        if: hashFiles('nx.json') != ''
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
        with:
          # Nx requires that we have a full Git history available.
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e #v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Enable Corepack
        if: hashFiles('package.json') != ''
        run: |
          # Enable corepack if packageManager is specified in package.json
          if jq -e '.packageManager' package.json >/dev/null 2>&1; then
            echo "packageManager field detected in package.json, enabling corepack"
            corepack enable
          fi

      - name: Configure Dependency Cache
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e #v6.4.0
        with:
          cache: ${{ inputs.package-manager }}
          node-version-file: .nvmrc

      - name: Install safe-chain
        run: |
          SAFE_CHAIN_URL="https://github.com/AikidoSec/safe-chain/releases/latest/download/install-safe-chain.sh"
          curl -fsSL "$SAFE_CHAIN_URL" | sh -s -- --ci

      - name: Setup additional environment variables
        if: env.HAVE_SECRETS_ENV_VARS == 'true'
        run: |
          # Parse and set additional environment variables securely
          # Supports multiline values (e.g., SSH keys)
          current_key=""
          current_value=""
          flush_var() {
            if [ -n "$current_key" ]; then
              while IFS= read -r mask_line; do
                [ -n "$mask_line" ] && echo "::add-mask::${mask_line}"
              done <<< "${current_value}"
              echo "Setting environment variable: ${current_key}"
              echo "${current_key}<<GHENV_EOF" >> $GITHUB_ENV
              echo "${current_value}" >> $GITHUB_ENV
              echo "GHENV_EOF" >> $GITHUB_ENV
            fi
          }
          while IFS= read -r line || [ -n "$line" ]; do
            if [[ "$line" =~ ^[A-Za-z_][A-Za-z0-9_]*= ]]; then
              flush_var
              current_key="${line%%=*}"
              current_value="${line#*=}"
            elif [ -n "$current_key" ]; then
              current_value="$(printf '%s\n%s' "${current_value}" "${line}")"
            fi
          done <<< "${SECRETS_ENV_VARS}"
          flush_var
        env:
          # zizmor: ignore[secrets-outside-env]
          SECRETS_ENV_VARS: ${{ secrets.ENV_VARS }}

      - name: Run pre-install commands
        if: inputs.pre-install-commands != ''
        run: |
          # Execute pre-install commands line by line
          echo "${INPUTS_PRE_INSTALL_COMMANDS}" | while IFS= read -r cmd; do
            if [ -n "$cmd" ]; then
              echo "Running: $cmd"
              eval "$cmd"
            fi
          done
        env:
          INPUTS_PRE_INSTALL_COMMANDS: ${{ inputs.pre-install-commands }}

      - name: Install dependencies
        run: |
          if [ "${INPUTS_PACKAGE_MANAGER}" = "yarn" ]; then
            yarn install ${FLAG_LOCK_DEPENDENCIES} ${FLAG_SKIP_CACHE} ${FLAG_DEBUG}
          else
            npm ci ${FLAG_DEBUG}
          fi
        env:
          FLAG_DEBUG: ${{ case(inputs.debug == true, '--verbose', '') }}
          FLAG_LOCK_DEPENDENCIES: ${{ case(inputs.is-yarn-classic == true, '--frozen-lockfile', '--immutable') }}
          FLAG_SKIP_CACHE: ${{ case(inputs.skip-cache == true, '--force', '') }}
          INPUTS_PACKAGE_MANAGER: ${{ inputs.package-manager }}

      - name: Register problem matchers
        uses: aligent/workflows/.github/actions/node-problem-matchers@main

      - name: Build
        run: |
          # Check Nx targets if this is an Nx workspace
          if [ -f "nx.json" ] && \
             npx nx show projects --with-target "${INPUTS_BUILD_COMMAND}" 2>/dev/null | grep -q .; then
            npx nx run-many -t ${INPUTS_BUILD_COMMAND} ${FLAG_DEBUG}
          else
            ${INPUTS_PACKAGE_MANAGER} run ${INPUTS_BUILD_COMMAND} ${FLAG_DEBUG}
          fi
        env:
          FLAG_DEBUG: ${{ case(inputs.debug == true, '--verbose', '') }}
          INPUTS_BUILD_COMMAND: ${{ inputs.build-command }}
          INPUTS_PACKAGE_MANAGER: ${{ inputs.package-manager }}

      - name: Remove problem matchers
        if: always()
        uses: aligent/workflows/.github/actions/node-problem-matchers@main
        with:
          action: remove

  test:
    name: 🧪 Pull Request Checks
    if: >-
      inputs.skip-test == false ||
      inputs.skip-lint == false ||
      inputs.skip-format == false ||
      inputs.skip-test-storybook == false ||
      inputs.skip-check-types == false
    runs-on: ubuntu-latest
    env:
      HAVE_SECRETS_ENV_VARS: ${{ secrets.ENV_VARS != '' }}
      NODE_OPTIONS: ${{ inputs.node-options }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
        with:
          persist-credentials: false

      - name: Fetch all commit history for Nx
        if: hashFiles('nx.json') != ''
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
        with:
          # Nx requires that we have a full Git history available.
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e #v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Enable Corepack
        if: hashFiles('package.json') != ''
        run: |
          # Enable corepack if packageManager is specified in package.json
          if jq -e '.packageManager' package.json >/dev/null 2>&1; then
            echo "packageManager field detected in package.json, enabling corepack"
            corepack enable
          fi

      - name: Configure Dependency Cache
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e #v6.4.0
        with:
          cache: ${{ inputs.package-manager }}
          node-version-file: .nvmrc

      - name: Install safe-chain
        run: |
          SAFE_CHAIN_URL="https://github.com/AikidoSec/safe-chain/releases/latest/download/install-safe-chain.sh"
          curl -fsSL "$SAFE_CHAIN_URL" | sh -s -- --ci

      - name: Setup additional environment variables
        if: env.HAVE_SECRETS_ENV_VARS == 'true'
        run: |
          # Parse and set additional environment variables securely
          # Supports multiline values (e.g., SSH keys)
          current_key=""
          current_value=""
          flush_var() {
            if [ -n "$current_key" ]; then
              while IFS= read -r mask_line; do
                [ -n "$mask_line" ] && echo "::add-mask::${mask_line}"
              done <<< "${current_value}"
              echo "Setting environment variable: ${current_key}"
              echo "${current_key}<<GHENV_EOF" >> $GITHUB_ENV
              echo "${current_value}" >> $GITHUB_ENV
              echo "GHENV_EOF" >> $GITHUB_ENV
            fi
          }
          while IFS= read -r line || [ -n "$line" ]; do
            if [[ "$line" =~ ^[A-Za-z_][A-Za-z0-9_]*= ]]; then
              flush_var
              current_key="${line%%=*}"
              current_value="${line#*=}"
            elif [ -n "$current_key" ]; then
              current_value="$(printf '%s\n%s' "${current_value}" "${line}")"
            fi
          done <<< "${SECRETS_ENV_VARS}"
          flush_var
        env:
          # zizmor: ignore[secrets-outside-env]
          SECRETS_ENV_VARS: ${{ secrets.ENV_VARS }}

      - name: Run pre-install commands
        if: inputs.pre-install-commands != ''
        run: |
          # Execute pre-install commands line by line
          echo "${INPUTS_PRE_INSTALL_COMMANDS}" | while IFS= read -r cmd; do
            if [ -n "$cmd" ]; then
              echo "Running: $cmd"
              eval "$cmd"
            fi
          done
        env:
          INPUTS_PRE_INSTALL_COMMANDS: ${{ inputs.pre-install-commands }}

      - name: Install dependencies
        run: |
          if [ "${INPUTS_PACKAGE_MANAGER}" = "yarn" ]; then
            yarn install ${FLAG_LOCK_DEPENDENCIES} ${FLAG_SKIP_CACHE} ${FLAG_DEBUG}
          else
            npm ci ${FLAG_DEBUG}
          fi
        env:
          FLAG_DEBUG: ${{ case(inputs.debug == true, '--verbose', '') }}
          FLAG_LOCK_DEPENDENCIES: ${{ case(inputs.is-yarn-classic == true, '--frozen-lockfile', '--immutable') }}
          FLAG_SKIP_CACHE: ${{ case(inputs.skip-cache == true, '--force', '') }}
          INPUTS_PACKAGE_MANAGER: ${{ inputs.package-manager }}

      - name: Install Playwright
        if: inputs.skip-test-storybook == false
        run: |
          # Ensure playwright dependencies are installed before story blok test execution begins
          if [ "${INPUTS_PACKAGE_MANAGER}" = "yarn" ]; then
            yarn playwright install --with-deps
          else
            npx playwright install --with-deps
          fi
        env:
          INPUTS_PACKAGE_MANAGER: ${{ inputs.package-manager }}

      - name: Run pre-test command
        if: inputs.pre-test-command != ''
        run: ${INPUTS_PACKAGE_MANAGER} run ${INPUTS_PRE_TEST_COMMAND}
        env:
          INPUTS_PACKAGE_MANAGER: ${{ inputs.package-manager }}
          INPUTS_PRE_TEST_COMMAND: ${{ inputs.pre-test-command }}

      - id: add-matchers
        uses: aligent/workflows/.github/actions/node-problem-matchers@main

      - name: Run checks
        run: |
          commands=()
          if [ "${INPUTS_SKIP_TEST}" != "true" ]; then
            commands+=("${INPUTS_PACKAGE_MANAGER} run ${INPUTS_TEST_COMMAND} ${FLAG_DEBUG}")
          fi
          if [ "${INPUTS_SKIP_LINT}" != "true" ]; then
            commands+=("${INPUTS_PACKAGE_MANAGER} run ${INPUTS_LINT_COMMAND} ${FLAG_DEBUG}")
          fi
          if [ "${INPUTS_SKIP_FORMAT}" != "true" ]; then
            commands+=("${INPUTS_PACKAGE_MANAGER} run ${INPUTS_FORMAT_COMMAND} ${FLAG_DEBUG}")
          fi
          if [ "${INPUTS_SKIP_TEST_STORYBOOK}" != "true" ]; then
            commands+=("${INPUTS_PACKAGE_MANAGER} run ${INPUTS_TEST_STORYBOOK_COMMAND} ${FLAG_DEBUG}")
          fi
          if [ "${INPUTS_SKIP_CHECK_TYPES}" != "true" ]; then
            commands+=("${INPUTS_PACKAGE_MANAGER} run ${INPUTS_CHECK_TYPES_COMMAND} ${FLAG_DEBUG}")
          fi
          if [ ${#commands[@]} -eq 0 ]; then
            echo "missing commands, job should have been skipped"
            exit 1
          fi

          echo "Running ${#commands[@]} check(s) in parallel..."
          parallel --tag --keep-order --line-buffer ::: "${commands[@]}"
        env:
          FLAG_DEBUG: ${{ case(inputs.debug == true, '--verbose', '') }}
          INPUTS_CHECK_TYPES_COMMAND: ${{ inputs.check-types-command }}
          INPUTS_FORMAT_COMMAND: ${{ inputs.format-command }}
          INPUTS_LINT_COMMAND: ${{ inputs.lint-command }}
          INPUTS_PACKAGE_MANAGER: ${{ inputs.package-manager }}
          INPUTS_SKIP_CHECK_TYPES: ${{ inputs.skip-check-types }}
          INPUTS_SKIP_FORMAT: ${{ inputs.skip-format }}
          INPUTS_SKIP_LINT: ${{ inputs.skip-lint }}
          INPUTS_SKIP_TEST_STORYBOOK: ${{ inputs.skip-test-storybook }}
          INPUTS_SKIP_TEST: ${{ inputs.skip-test }}
          INPUTS_TEST_COMMAND: ${{ inputs.test-command }}
          INPUTS_TEST_STORYBOOK_COMMAND: ${{ inputs.test-storybook-command }}

      - id: remove-matchers
        if: always()
        uses: aligent/workflows/.github/actions/node-problem-matchers@main
        with:
          action: remove
