name: 🤖 Gadget Deploy
on:
  workflow_call:
    inputs:
      # Core Configuration
      app-name:
        description: "Gadget App name to deploy to (required)"
        type: string
        required: true
      working-directory:
        description: "Working directory for the Gadget app"
        type: string
        required: false
        default: "."
      environment-name:
        description: "Staging/Development environment of Gadget App to push code (required when action is 'push')"
        type: string
        required: false

      # Deployment Control
      action:
        description: "Deployment action to perform: 'push' (push to environment) or 'deploy' (deploy to production)"
        type: string
        required: true

      # Backport Configuration
      create-backport-pr:
        description: "Create a backport PR to staging after deployment"
        type: boolean
        default: false
      backport-target-branch:
        description: "Target branch for backport PR"
        type: string
        default: "staging"

    secrets:
      ggt-cli-token:
        description: "GGT cli token"
        required: true

jobs:
  push:
    name: 🫸 Push to Gadget
    runs-on: ubuntu-latest
    if: inputs.action == 'push'
    env:
      GGT_TOKEN: ${{ secrets.ggt-cli-token }}
    outputs:
      push-environment-status: ${{ steps.push-environment.outcome }}
    steps:
      - name: Validate environment-name
        run: |
          if [ -z "${INPUTS_ENVIRONMENT_NAME}" ]; then
            echo "::error::environment-name is required when action is 'push'"
            exit 1
          fi
        env:
          INPUTS_ENVIRONMENT_NAME: ${{ inputs.environment-name }}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
        with:
          persist-credentials: false

      - name: Install ggt
        run: |
          npm install -g ggt
          ggt version

      - name: Push code to environment in Gadget
        id: push-environment
        working-directory: ${{ inputs.working-directory }}
        run: |
          ggt push \
            --app=${INPUTS_APP_NAME} \
            --env=${INPUTS_ENVIRONMENT_NAME} \
            --force --allow-unknown-directory
        env:
          INPUTS_APP_NAME: ${{ inputs.app-name }}
          INPUTS_ENVIRONMENT_NAME: ${{ inputs.environment-name }} 

  deploy:
    name: 🚀 Deploying Gadget
    runs-on: ubuntu-latest
    if: inputs.action == 'deploy'
    env:
      GGT_TOKEN: ${{ secrets.ggt-cli-token }}
      INPUTS_APP_NAME: ${{ inputs.app-name }}
      TEMP_ENV_NAME: deploy-${{ github.run_id }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
        with:
          persist-credentials: false

      - name: Install ggt
        run: |
          npm install -g ggt
          ggt version

      - name: Create temp Gadget environment
        run: |
          ggt env create ${TEMP_ENV_NAME} \
            --app ${INPUTS_APP_NAME}

      - name: Wait for environment provisioning to settle
        # `ggt env create` returns as soon as the environment record exists, but Gadget
        # keeps copying files in the background. Pushing immediately can cause
        # "Your environment's files have changed since we last checked." error.
        run: sleep 30

      - name: Push code to temp Gadget environment
        working-directory: ${{ inputs.working-directory }}
        # Retry on top of the delay: a busy backend can still be mid-provisioning past the
        # sleep, and ggt's own error message for this race is literally "please re-run ggt push".
        run: |
          attempt=1
          until ggt push \
            --app=${INPUTS_APP_NAME} \
            --env=${TEMP_ENV_NAME} \
            --force --allow-unknown-directory
          do
            if [ "$attempt" -ge 3 ]; then
              echo "ggt push failed after $attempt attempts"
              exit 1
            fi
            echo "ggt push failed (attempt $attempt), retrying in 10s..."
            sleep 10
            attempt=$((attempt+1))
          done

      - name: Deploy (promote) to Production environment in Gadget
        working-directory: ${{ inputs.working-directory }}
        run: |
          ggt deploy \
            --app=${INPUTS_APP_NAME} \
            --env=${TEMP_ENV_NAME} \
            --force --allow-unknown-directory --allow-problems

      - name: Remove temp Gadget environment
        if: always()
        run: |
          ggt env delete ${TEMP_ENV_NAME} \
            --app ${INPUTS_APP_NAME} \
            --force

      - name: Backport to staging
        if: success() && inputs.create-backport-pr
        uses: aligent/workflows/.github/actions/backport@main
        with:
          target-branch: ${{ inputs.backport-target-branch }}
